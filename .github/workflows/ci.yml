name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web

      # The offline fixtures mean the whole pipeline runs in CI with no API key and no
      # network, so a broken run fails the build rather than the demo.
      - run: npm run demo
